# Optional supervisor settings. CLI arguments override these values.
# These do not alter joint limits, SDK timing or gripper conversion.
startup:
  initialize_can: false
  activate: true
  start_controllers: true
  control_cpu: -1
  process_cpus: ""
  rviz: true
  remote_rviz: false
  conflicting_processes: []
  can:
    bitrate: 1000000
    data_bitrate: 5000000
    restart_ms: 1000
    tx_queue: 64
diagnostics:
  directory: ""  # Empty means diagnostics/ beside the reviewed config.
  can_capture: false
  usb_capture: false
  usb_channels: [0, 1]  # Physical adapter channels corresponding to buses, in order.
  usb_cpu: -1  # Auto-select from inherited affinity, avoiding configured SDK/control CPUs.
  gripper_trace: false
  diagnostics_required: false
