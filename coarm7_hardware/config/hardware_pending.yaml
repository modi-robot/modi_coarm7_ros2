# Standard CoArm7 dual-arm mapping; review the full template for each machine.
# Normal deactivate disables the arms; faults request a quick stop.
# Arm and gripper control are enabled by default; set gripper_read_only=true for arm-only control.
# Feedback follows the existing system convention q=0.864*(1-raw/1000).
# command_raw keeps the existing 1..100 percent position-command range.
# max_cycle_ms is a ROS host deadline guard, not a firmware SYNC jitter threshold.
transport: sdk
commissioning_confirmed: false
gripper_read_only: false
deactivate_policy: disable
device_report_file: ""  # Optional writable YAML path; snapshot is always logged at configure.
buses:
- can0
- can1
sdk_rx:
  cpu: -1  # No fixed core; choose explicitly for the target machine.
  priority: 90
sdk_tx:
  cpu: -1  # No fixed core; reviewed machine settings take precedence.
  priority: 90
  timestamp_diagnostics: false
  lock_memory: true
timing:
  period_us: 5000
  joint_timeout_ms: 50
  gripper_timeout_ms: 500
  gripper_poll_ms: 50
  gripper_response_ms: 200
  gripper_command_ms: 5
  gripper_position_ms: 50  # Only opening targets are coalesced; SYNC and query timing are unchanged.
  startup_timeout_ms: 1000
  sdo_timeout_ms: 500
  disable_settle_ms: 20
  stop_wait_ms: 1000
  stop_velocity_tolerance: 0.02  # Software criterion, rad/s; not a drive acknowledgement.
  max_cycle_ms: 7.5
  max_consecutive_overruns: 3
